<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f5f7">
<meta name="robots" content="noindex,nofollow">
<title>サービスを利用できません</title>
<style>
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;padding:24px;display:grid;place-items:center;
  color:#202124;background:#f4f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif
}
main{width:min(100%,560px);text-align:center}
.icon{
  width:72px;height:72px;margin:0 auto 24px;display:grid;place-items:center;
  border-radius:50%;background:#e8eaed;color:#5f6368;font-size:34px;font-weight:700
}
.code{margin:0 0 10px;color:#80868b;font-size:13px;font-weight:600;letter-spacing:.12em}
h1{margin:0 0 18px;font-size:clamp(24px,6vw,32px);line-height:1.45}
p{margin:0;color:#5f6368;font-size:15px;line-height:1.9}
.detail{
  margin-top:28px;padding:17px 18px;text-align:left;
  background:#fff;border:1px solid #dadce0;border-radius:10px;
  color:#6b7075;font-size:13px;line-height:1.75
}
.detail b{display:block;margin-bottom:3px;color:#3c4043;font-size:13px}
footer{margin-top:24px;color:#9aa0a6;font-size:11px}
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">!</div>
  <p class="code">SERVICE UNAVAILABLE</p>
  <h1>現在、このアプリは利用できません</h1>
  <p>運用上の都合により、サービスを一時停止しています。</p>
  <div class="detail">
    <b>ご利用の皆さまへ</b>
    再開時期は未定です。今後の連絡や情報共有については、別途ご案内します。
  </div>
  <footer>忠生中バスケ部 TEAM BOARD</footer>
</main>
</body>
</html>
