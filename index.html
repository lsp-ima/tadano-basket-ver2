<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17233d">
  <meta name="robots" content="noindex, nofollow">
  <title>忠生中バスケ部｜一時休止のお知らせ</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #17233d;
      background:
        radial-gradient(circle at 20% 10%, rgba(226,89,31,.12), transparent 34rem),
        linear-gradient(160deg, #fbfaf7 0%, #f1eee6 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    }
    main {
      width: min(100%, 560px);
      padding: 44px 28px 38px;
      text-align: center;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(23,35,61,.1);
      border-radius: 22px;
      box-shadow: 0 18px 55px rgba(23,35,61,.12);
    }
    .ball {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      margin: 0 auto 22px;
      border-radius: 18px;
      color: white;
      font-size: 30px;
      background: linear-gradient(135deg, #24385f, #17233d);
      box-shadow: 0 10px 24px rgba(23,35,61,.22);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: #df591f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
    }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(23px, 6vw, 31px);
      line-height: 1.45;
    }
    p {
      margin: 0;
      color: #596579;
      font-size: 15px;
      line-height: 2;
    }
    .note {
      margin-top: 25px;
      padding-top: 21px;
      border-top: 1px solid #e7e3da;
      color: #89909c;
      font-size: 12px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main>
    <div class="ball" aria-hidden="true">🏀</div>
    <p class="eyebrow">TADAO BASKETBALL TEAM</p>
    <h1>アプリ一時休止のお知らせ</h1>
    <p>
      現在、運用方法の見直しと掲載内容の整理のため、<br>
      本アプリの公開を一時休止しています。<br>
      ご理解のほど、よろしくお願いいたします。
    </p>
    <p class="note">再開については、準備が整い次第お知らせします。</p>
  </main>
</body>
</html>
